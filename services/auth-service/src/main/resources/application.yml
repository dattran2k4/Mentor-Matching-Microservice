server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mm_auth}
    username: ${DB_USERNAME:mm_auth}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    # Enable once discovery-service exists.
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:auth-service}
    audience: ${AUTH_JWT_AUDIENCE}
    access-ttl: ${AUTH_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_JWT_REFRESH_TTL:30d}
    private-key-path: ${AUTH_JWT_PRIVATE_KEY_PATH}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    path: ${AUTH_COOKIE_PATH:/api/v1/auth}
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
